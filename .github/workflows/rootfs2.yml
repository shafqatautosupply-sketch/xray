name: rootfs-manifest
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev zlib1g-dev libbz2-dev
      - name: Build libdmg-hfsplus (patched for OpenSSL 3)
        run: |
          git clone --depth 1 https://github.com/planetbeing/libdmg-hfsplus ld
          cd ld
          sed -i 's/HMAC_CTX\thmacCTX;/HMAC_CTX\t*hmacCTX;/' includes/dmg/filevault.h
          sed -i 's/&(info->hmacCTX)/info->hmacCTX/g; s/HMAC_CTX_cleanup(/HMAC_CTX_free(/; s/HMAC_CTX_init(info->hmacCTX);/info->hmacCTX = HMAC_CTX_new();/' dmg/filevault.c
          python3 - <<'PYEOF'
          import sys
          p = "hfs/hfscompress.c"
          s = open(p).read()
          old1 = """\t\tdata->cached = (uint8_t*) malloc(data->decmpfs->size);
          \t\tactualSize = data->decmpfs->size;
          \t\tuncompress(data->cached, &actualSize, data->decmpfs->data, data->decmpfsSize - sizeof(HFSPlusDecmpfs));
          \t\tif(actualSize != data->decmpfs->size) {
          \t\t\tfprintf(stderr, "decmpfs: size mismatch\\n");
          \t\t}
          """
          new1 = """\t\t{
          \t\t\tuint8_t* src = (uint8_t*) data->decmpfs->data;
          \t\t\tsize_t srcLen = data->decmpfsSize - sizeof(HFSPlusDecmpfs);
          \t\t\tsize_t want = data->decmpfs->size;
          \t\t\tdata->cached = (uint8_t*) calloc(want ? want : 1, 1);
          \t\t\tactualSize = want;
          \t\t\tif(srcLen > 0 && src[0] == 0xFF) {
          \t\t\t\tactualSize = srcLen - 1;
          \t\t\t\tif(actualSize > want) actualSize = want;
          \t\t\t\tmemcpy(data->cached, src + 1, actualSize);
          \t\t\t} else if(uncompress(data->cached, &actualSize, src, srcLen) != Z_OK) {
          \t\t\t\tactualSize = 0;
          \t\t\t}
          \t\t\tif(actualSize != want) {
          \t\t\t\tprintf("decmpfs: size mismatch (got %lu want %lu), zero-filled\\n", (unsigned long) actualSize, (unsigned long) want);
          \t\t\t\tactualSize = want;
          \t\t\t}
          \t\t}
          """
          assert old1 in s; s = s.replace(old1, new1)
          old2 = """\t\tdata->cached = (uint8_t*) malloc(0x10000);
          \t\tactualSize = 0x10000;
          \t\tuncompress(data->cached, &actualSize, compressed, data->blocks->blocks[block].size);
          """
          new2 = """\t\tdata->cached = (uint8_t*) calloc(0x10000, 1);
          \t\tactualSize = 0x10000;
          \t\tif(data->blocks->blocks[block].size > 0 && compressed[0] == 0xFF) {
          \t\t\tactualSize = data->blocks->blocks[block].size - 1;
          \t\t\tif(actualSize > 0x10000) actualSize = 0x10000;
          \t\t\tmemcpy(data->cached, compressed + 1, actualSize);
          \t\t} else if(uncompress(data->cached, &actualSize, compressed, data->blocks->blocks[block].size) != Z_OK) {
          \t\t\tprintf("decmpfs: block %u failed, zero-filled\\n", block);
          \t\t\tactualSize = 0x10000;
          \t\t}
          """
          assert old2 in s; s = s.replace(old2, new2)
          old3 = """\t\tuint32_t block = location / 0x10000;
          """
          new3 = """\t\tuint32_t block = location / 0x10000;
          \t\tif(data->blocks == NULL || block >= data->blocks->numBlocks) {
          \t\t\tprintf("decmpfs: read past blocks, zero-filling\\n");
          \t\t\tmemset(buffer, 0, size);
          \t\t\treturn TRUE;
          \t\t}
          """
          assert old3 in s; s = s.replace(old3, new3)
          open(p, "w").write(s)
          print("patched")
          PYEOF
          mkdir b && cd b && cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && make -j4 dmg-bin hfsplus
      - name: Download IPSW and pull the root filesystem
        run: |
          curl -fL -o fw.ipsw "https://secure-appldnld.apple.com/iOS6.1/091-2611.20130319.Fr54r/iPhone4,1_6.1.3_10B329_Restore.ipsw"
          unzip -o fw.ipsw 048-2613-005.dmg
          rm fw.ipsw
      - name: Decrypt and extract
        run: |
          ./ld/b/dmg/dmg extract 048-2613-005.dmg rootfs.hfs -k d4685a3c01a0b6f762350191d98b8964d4c7af349aa84bacef828be9683514ccf44a8426
          rm 048-2613-005.dmg
          mkdir rootfs
          ./ld/b/hfs/hfsplus rootfs.hfs extractall / rootfs > extract.log
          tail -3 extract.log
          echo "decmpfs notes: $(grep -c decmpfs extract.log || true)"
          grep decmpfs extract.log | head -20 || true
      - name: Build manifest
        run: |
          cd rootfs
          find . -type f -print0 | sort -z | xargs -0 sha256sum | gzip -9 > ../rootfs-manifest.txt.gz
          cd ..
          echo "files: $(zcat rootfs-manifest.txt.gz | wc -l)"
          ls -la rootfs-manifest.txt.gz
      - name: Stock copies and dyld cache chunk hashes
        run: |
          cd rootfs
          tar czf ../stock-small.tar.gz System/Library/LaunchDaemons System/Library/Lockdown private/etc System/Library/CoreServices/SpringBoard.app/Info.plist System/Library/CoreServices/SpringBoard.app/N94AP.plist
          cd ..
          python3 - <<'PYEOF'
          import hashlib, os
          p = "rootfs/System/Library/Caches/com.apple.dyld/dyld_shared_cache_armv7"
          out = [str(os.path.getsize(p))]
          with open(p, "rb") as f:
              for c in iter(lambda: f.read(1 << 20), b""): out.append(hashlib.sha256(c).hexdigest())
          open("dyld-chunks.txt", "w").write("\n".join(out) + "\n")
          print("chunks:", len(out) - 1)
          PYEOF
          ls -la stock-small.tar.gz dyld-chunks.txt
      - name: Commit manifest to the repo
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add rootfs-manifest.txt.gz stock-small.tar.gz dyld-chunks.txt
          git commit -m "rootfs manifest 6.1.3 10B329 iPhone4,1"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-manifest
          path: |
            rootfs-manifest.txt.gz
            stock-small.tar.gz
            dyld-chunks.txt
 
